name: CI

on:
  # No path filter here: main requires these checks, so every pull request must report them.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'macros/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - '.cargo/**'
      - '.gitattributes'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  validate:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Validate on Unix
        if: runner.os != 'Windows'
        run: bash scripts/verify.sh
      - name: Validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.target }}
          path: coverage/**/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.85.0'
      - run: cargo check --workspace --all-targets --locked

  # Runtime checks for undefined behaviour, set up like crossbeam's CI. They need a
  # pinned nightly, which also checks mock! against the next-generation trait solver.
  careful:
    name: cargo careful (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    env:
      RUSTFLAGS: -Z randomize-layout
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: rust@nightly-2026-09-12+rust-src,cargo-careful
          fallback: none
      # shimforge-macros is left out: its test binary cannot load the shared std that
      # cargo careful builds, and its code only runs inside the compiler.
      - name: Test suite
        shell: bash
        run: cargo careful test -p shimforge --locked --no-fail-fast -- --test-threads=1
      - name: Parallel tests
        if: success() || failure()
        shell: bash
        run: cargo careful test -p shimforge --locked --test parallel -- --test-threads=8

  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            target: x86_64-unknown-linux-gnuasan
            build-std: ''
          - name: ThreadSanitizer
            target: x86_64-unknown-linux-gnutsan
            build-std: -Z build-std
    env:
      ASAN_OPTIONS: detect_stack_use_after_return=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/lsan-suppressions.txt
      TSAN_OPTIONS: enable_adaptive_delay=1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: rust@nightly-2026-09-12+rust-src+${{ matrix.target }}
          fallback: none
      # Leak suppressions match function names, so reports must be symbolized.
      - name: Find a symbolizer
        run: |
          path=$(command -v llvm-symbolizer || true)
          if [ -z "$path" ]; then
            path=$(ls /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$path" ]; then
            sudo apt-get update && sudo apt-get install -y llvm
            path=$(command -v llvm-symbolizer)
          fi
          echo "ASAN_SYMBOLIZER_PATH=$path" >> "$GITHUB_ENV"
      - name: Test suite
        run: cargo test ${{ matrix.build-std }} -p shimforge --locked --no-fail-fast --target ${{ matrix.target }} --tests -- --test-threads=1
      - name: Parallel tests
        if: success() || failure()
        run: cargo test ${{ matrix.build-std }} -p shimforge --locked --target ${{ matrix.target }} --test parallel -- --test-threads=8
