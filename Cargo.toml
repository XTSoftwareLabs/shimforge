[package]
name = "shimforge"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Test Rust code without test-only traits or changes to production code."
license = "PolyForm-Small-Business-1.0.0 OR PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/XTSoftwareLabs/shimforge"
readme = "README.md"
keywords = ["mock", "testing", "detour"]
categories = ["development-tools::testing"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "COMMERCIAL.md", "LICENSE*", "README.md"]

[workspace]
members = ["macros"]
resolver = "3"

[dependencies]
shimforge-macros = { version = "0.1.1", path = "macros" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"], default-features = false }

# Examples double as tests: `test = true` makes `cargo test` run their #[test] functions.
[[example]]
name = "clock"
test = true

[[example]]
name = "environment"
test = true

[profile.test]
opt-level = 0
debug = true
lto = false
codegen-units = 1
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
