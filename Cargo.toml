[package]
name = "shimforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Scoped function replacement for Rust tests on Windows and Linux x86-64"
license = "MIT"
repository = "https://github.com/XTSoftwareLabs/shimforge"
readme = "README.md"
keywords = ["mock", "testing", "detour"]
categories = ["development-tools::testing"]
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation"] }

[profile.test]
opt-level = 0
debug = true
lto = false
codegen-units = 1
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
