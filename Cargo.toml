[package]
name = "shimforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Scoped function replacement for Rust tests on Windows, Linux, and macOS x86-64"
license = "MIT"
repository = "https://github.com/XTSoftwareLabs/shimforge"
readme = "README.md"
keywords = ["mock", "testing", "detour"]
categories = ["development-tools::testing"]
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE", "README.md"]

[workspace]
members = ["macros"]
resolver = "3"

[dependencies]
shimforge-macros = { version = "0.1.0", path = "macros" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[profile.test]
opt-level = 0
debug = true
lto = false
codegen-units = 1
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
